name: Validate converged transcription v25 rerun

on:
  pull_request:
    paths:
      - TRANSCRIBE_B.py
      - TRANSCRIPT_FORMATTING_PROMPT.txt

permissions:
  contents: read

jobs:
  validate-v25-rerun:
    if: github.head_ref == 'deliverables/20260802-converged-transcription-v25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and convergence guards
        shell: bash
        run: |
          python -m py_compile TRANSCRIBE_B.py
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('transcribe_v25', 'TRANSCRIBE_B.py')
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          assert module.TRANSCRIPTION_VERSION == 25
          assert module.V25_PATCH_APPLIED is True
          assert module.SECTION_WINDOW_SECONDS == 90.0
          assert module.SECTION_WINDOW_HOP_SECONDS == 45.0
          assert module.is_complete_recovered_candidate('Suppose we asked Emily for advice')
          assert module.is_complete_recovered_candidate('Imagine we asked Emily for advice')
          assert module.is_complete_recovered_candidate('Just an idea, but we could try leaving a little earlier tomorrow.')
          assert not module.is_complete_recovered_candidate('Just an idea, but')
          assert not module.is_complete_recovered_candidate('It might be a good idea for us')
          assert not module.is_complete_recovered_candidate('to discuss this together.')

          sample = '\n'.join([
              'What if we baked him a cake ourselves?',
              'What if we baked him a cake ourselves?',
              'What if we baked him a cake ourselves?',
              'What if we baked him a cake ourselves?',
              'What if we baked a macaque ourselves?',
              'What if we baked a macaque ourselves?',
          ])
          corrected, corrections = module.correct_repeated_english_variants(sample)
          assert 'macaque' not in corrected.lower()
          assert corrections

          source = Path('TRANSCRIBE_B.py').read_text(encoding='utf-8')
          assert 'flash_attention=False' in source
          assert '45.0 if section_name == "Essential Expressions"' not in source
          assert Path('TRANSCRIPT_FORMATTING_PROMPT.txt').is_file()
          print('V25_RERUN_VALIDATION=PASS')
          PY
