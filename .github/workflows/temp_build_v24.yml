name: Temporary build transcription v24

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-v24:
    if: github.head_ref == 'deliverables/20260802-converged-transcription-v24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch and validate source
        run: |
          python build_v24_patch.py
          python -m py_compile TRANSCRIBE_B.py
          python -m pip install --quiet pyflakes
          pyflakes TRANSCRIBE_B.py
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TRANSCRIBE_B.py
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'Build converged transcription v24'
            git push origin HEAD:deliverables/20260802-converged-transcription-v24
          fi
