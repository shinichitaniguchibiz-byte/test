name: Validate converged transcription v21

on:
  push:
    branches:
      - deliverables/20260802-converged-transcription-v21
    paths:
      - TRANSCRIBE_B.py

permissions:
  contents: write

jobs:
  validate-v21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deliverables/20260802-converged-transcription-v21
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source
        shell: bash
        run: |
          python -m py_compile TRANSCRIBE_B.py
          python -m pip install --quiet pyflakes
          pyflakes TRANSCRIBE_B.py
          python - <<'PY'
          import ast
          import runpy
          from pathlib import Path

          source = Path('TRANSCRIBE_B.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          names = {node.name for node in ast.walk(tree) if isinstance(node, ast.FunctionDef)}
          required = {
              'main',
              'run_transcription',
              'transcribe_batched_baseline',
              'transcribe_section_windows',
              'recover_time_local_consensus',
              'lesson76_regression',
          }
          missing = required - names
          if missing:
              raise SystemExit(f'missing functions: {sorted(missing)}')
          assert 'TRANSCRIPTION_VERSION = 21' in source
          assert 'use_flash_attention=False' in source
          assert 'FULL_AUDIO_SECOND_PASS_USED=NO' in source
          assert 'LARGE_V3_USED=NO' in source
          module = runpy.run_path('TRANSCRIBE_B.py', run_name='v21_validation')
          result = module['lesson76_regression'](Path('other.m4a'), 10.0, [])
          assert result['status'] == 'NOT_APPLICABLE'
          print('V21_VALIDATION=PASS')
          PY
      - name: Record validation
        shell: bash
        run: |
          printf 'V21_VALIDATION=PASS\nSOURCE_SHA=%s\n' "$GITHUB_SHA" > V21_VALIDATION.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add V21_VALIDATION.txt
          git commit -m "Record v21 source validation"
          git push origin HEAD:deliverables/20260802-converged-transcription-v21
