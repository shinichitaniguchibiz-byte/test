name: Build converged transcription v21

on:
  pull_request:
    paths:
      - .github/workflows/build_converged_v21.yml

permissions:
  contents: write

jobs:
  build-v21:
    if: github.head_ref == 'deliverables/20260802-converged-transcription-v21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build v21 convergence source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('TRANSCRIBE_B.py')
          source = path.read_text(encoding='utf-8')
          if 'V21_PATCH_APPLIED = True' in source:
              raise SystemExit(0)

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f'expected one match, found {count}: {old[:120]!r}')
              source = source.replace(old, new, 1)

          replace_once(
              'V20_PATCH_APPLIED = True\n',
              'V20_PATCH_APPLIED = True\nV21_PATCH_APPLIED = True\n',
          )

          extension = r'''
          V21_WINDOW_SECONDS = 30.0
          V21_HOP_SECONDS = 10.0
          V21_EVENT_CLUSTER_SECONDS = 7.0
          V21_LOCAL_DUPLICATE_PADDING_SECONDS = 5.0
          V21_MIN_EVENT_SOURCE_SUPPORT = 2
          V21_MIN_EVENT_AVG_LOGPROB = -0.55
          V21_MIN_REPEATED_EVENT_AVG_LOGPROB = -0.48
          V21_SECTION_NAMES = (
              'Grammar and Vocabulary',
              'Essential Expressions',
              'Practical Usage',
          )


          def section_coverage_plan_v21(
              segments: list[SegmentRecord],
              audio_seconds: float,
          ) -> list[dict[str, object]]:
              intervals = section_intervals_v20(segments, audio_seconds)
              plan: list[dict[str, object]] = []
              for section_name in V21_SECTION_NAMES:
                  interval = intervals.get(section_name)
                  if interval is None:
                      continue
                  start, end = interval
                  if end - start < 8.0:
                      continue
                  plan.append({
                      'section': section_name,
                      'start': start,
                      'end': end,
                      'seconds': end - start,
                  })
              return plan


          def transcribe_section_windows_v21(
              model: object,
              audio: object,
              *,
              section_name: str,
              start: float,
              end: float,
          ) -> tuple[list[SegmentRecord], int]:
              records: list[SegmentRecord] = []
              window_count = 0
              cursor = start
              slug = re.sub(r'[^a-z0-9]+', '_', section_name.lower()).strip('_')
              while cursor < end:
                  chunk_end = min(end, cursor + V21_WINDOW_SECONDS)
                  if chunk_end - cursor < 8.0 and window_count > 0:
                      break
                  window_count += 1
                  print(
                      f'SECTION_COVERAGE_WINDOW SECTION={section_name} '
                      f'INDEX={window_count:02d} START={cursor:.3f} END={chunk_end:.3f}'
                  )
                  records.extend(
                      transcribe_slice(
                          model,
                          audio,
                          start=cursor,
                          end=chunk_end,
                          language='en',
                          source=f'v21_{slug}_w{window_count:02d}',
                          beam_size=3,
                          multilingual=False,
                      )
                  )
                  if chunk_end >= end:
                      break
                  cursor += V21_HOP_SECONDS
              return records, window_count


          def baseline_local_candidates_v21(
              segments: list[SegmentRecord],
              start: float,
              end: float,
          ) -> list[str]:
              text = ' '.join(
                  item.text
                  for item in segments
                  if item.end >= start - V21_LOCAL_DUPLICATE_PADDING_SECONDS
                  and item.start <= end + V21_LOCAL_DUPLICATE_PADDING_SECONDS
              )
              return split_english_candidates(text)


          def recover_time_local_consensus_v21(
              baseline_segments: list[SegmentRecord],
              audit_segments: list[SegmentRecord],
              section_name: str,
          ) -> tuple[list[SegmentRecord], list[dict[str, object]]]:
              observations = candidate_sentences_v20(audit_segments)
              clusters: list[list[dict[str, object]]] = []
              for observation in observations:
                  best_index: int | None = None
                  best_ratio = 0.0
                  for index, cluster in enumerate(clusters):
                      ratio = SequenceMatcher(
                          None,
                          str(observation['normalized']),
                          str(cluster[0]['normalized']),
                      ).ratio()
                      if ratio > best_ratio:
                          best_index = index
                          best_ratio = ratio
                  if best_index is not None and best_ratio >= 0.88:
                      clusters[best_index].append(observation)
                  else:
                      clusters.append([observation])

              recovered: list[SegmentRecord] = []
              evidence: list[dict[str, object]] = []
              for cluster_index, cluster in enumerate(clusters):
                  variants = Counter(clean_text(str(item['text'])) for item in cluster)
                  canonical = max(
                      variants,
                      key=lambda value: (variants[value], len(value)),
                  )
                  canonical_normalized = normalize_for_comparison(canonical)
                  canonical_words = english_words(canonical)
                  if not 4 <= len(canonical_words) <= 36:
                      continue
                  if any(
                      alias.lower() in canonical.lower()
                      for aliases in STRICT_SECTION_ALIASES.values()
                      for alias in aliases
                  ):
                      continue
                  matching = [
                      item for item in cluster
                      if SequenceMatcher(
                          None,
                          canonical_normalized,
                          str(item['normalized']),
                      ).ratio() >= 0.90
                  ]
                  matching.sort(key=lambda item: (float(item['start']) + float(item['end'])) / 2.0)
                  if not matching:
                      continue

                  events: list[list[dict[str, object]]] = []
                  for item in matching:
                      midpoint = (float(item['start']) + float(item['end'])) / 2.0
                      if not events:
                          events.append([item])
                          continue
                      previous_midpoint = sum(
                          (float(value['start']) + float(value['end'])) / 2.0
                          for value in events[-1]
                      ) / len(events[-1])
                      if midpoint - previous_midpoint > V21_EVENT_CLUSTER_SECONDS:
                          events.append([item])
                      else:
                          events[-1].append(item)

                  repeated_at_separate_times = len(events) >= 2
                  for event_index, event in enumerate(events):
                      sources = sorted({str(item['source']) for item in event})
                      event_start = min(float(item['start']) for item in event)
                      event_end = max(float(item['end']) for item in event)
                      event_avg_logprob = sum(float(item['avg_logprob']) for item in event) / len(event)
                      source_supported = len(sources) >= V21_MIN_EVENT_SOURCE_SUPPORT
                      repeated_supported = (
                          repeated_at_separate_times
                          and event_avg_logprob >= V21_MIN_REPEATED_EVENT_AVG_LOGPROB
                      )
                      accepted = source_supported and event_avg_logprob >= V21_MIN_EVENT_AVG_LOGPROB
                      evidence_type = 'overlapping_window_consensus'
                      if not accepted and repeated_supported:
                          accepted = True
                          evidence_type = 'same_sentence_repeated_at_separate_times'

                      local_candidates = baseline_local_candidates_v21(
                          baseline_segments,
                          event_start,
                          event_end,
                      )
                      local_similarity = max(
                          (
                              SequenceMatcher(
                                  None,
                                  canonical_normalized,
                                  normalize_for_comparison(candidate),
                              ).ratio()
                              for candidate in local_candidates
                          ),
                          default=0.0,
                      )
                      already_present = any(
                          canonical_normalized in normalize_for_comparison(candidate)
                          or normalize_for_comparison(candidate) in canonical_normalized
                          or SequenceMatcher(
                              None,
                              canonical_normalized,
                              normalize_for_comparison(candidate),
                          ).ratio() >= 0.86
                          for candidate in local_candidates
                          if normalize_for_comparison(candidate)
                      )
                      reason = 'accepted'
                      if already_present:
                          accepted = False
                          reason = 'already_present_at_same_time'
                      elif not source_supported and not repeated_supported:
                          reason = 'insufficient_independent_support'
                      elif event_avg_logprob < V21_MIN_EVENT_AVG_LOGPROB and not repeated_supported:
                          reason = 'low_event_confidence'

                      record = {
                          'cluster_index': cluster_index,
                          'event_index': event_index,
                          'section': section_name,
                          'text': canonical,
                          'start': event_start,
                          'end': event_end,
                          'source_count': len(sources),
                          'sources': sources,
                          'avg_logprob': event_avg_logprob,
                          'temporal_event_count': len(events),
                          'evidence_type': evidence_type,
                          'local_similarity': local_similarity,
                          'accepted': accepted,
                          'decision_reason': reason,
                      }
                      evidence.append(record)
                      if not accepted:
                          continue
                      recovered.append(
                          SegmentRecord(
                              start=event_start,
                              end=event_end,
                              text=canonical,
                              avg_logprob=event_avg_logprob,
                              compression_ratio=0.0,
                              no_speech_prob=0.0,
                              source='turbo_v21_time_local_section_consensus',
                          )
                      )

              return deduplicate_segments(recovered), evidence


          def regression_profile_v21(
              input_file: Path,
              audio_seconds: float,
              segments: list[SegmentRecord],
          ) -> dict[str, object]:
              if input_file.name.lower() != 'b.m4a' or not 850.0 <= audio_seconds <= 870.0:
                  return {'status': 'NOT_APPLICABLE', 'profile': None, 'items': []}
              checks = [
                  ("Dad's birthday is coming up next week", 20.0, 100.0, 1, 'opening_dialogue'),
                  ("We're not exactly great in the kitchen", 20.0, 120.0, 1, 'opening_dialogue'),
                  ("We're not exactly great in the kitchen", 180.0, 330.0, 2, 'grammar_quote_and_replay'),
                  ("Suppose we asked Emily for advice", 385.0, 435.0, 1, 'essential_first_example'),
                  ("Suppose we asked Emily for advice", 465.0, 535.0, 1, 'essential_practice'),
                  ("Imagine we asked Emily for advice", 385.0, 435.0, 1, 'essential_first_example'),
                  ("Imagine we asked Emily for advice", 465.0, 535.0, 1, 'essential_practice'),
                  ("It might be a good idea for us to discuss this together", 410.0, 470.0, 1, 'essential_first_example'),
                  ("It might be a good idea for us to discuss this together", 480.0, 540.0, 1, 'essential_practice'),
                  ("Just an idea, but we could try leaving a little earlier tomorrow", 440.0, 490.0, 1, 'essential_first_example'),
                  ("Just an idea, but we could try leaving a little earlier tomorrow", 490.0, 545.0, 1, 'essential_practice'),
                  ("It might be a good idea for us to take a break for a while", 620.0, 660.0, 1, 'practical_model_answer'),
                  ("We've been at this for a long time", 620.0, 660.0, 1, 'practical_model_answer'),
                  ("We're all a bit tired", 620.0, 660.0, 1, 'practical_model_answer'),
                  ("It might be a good idea for us to take a break for a while", 680.0, 735.0, 1, 'practical_practice'),
                  ("We've been at this for a long time", 680.0, 735.0, 1, 'practical_practice'),
                  ("We're all a bit tired", 680.0, 735.0, 1, 'practical_practice'),
                  ("What if we baked him a cake ourselves", 735.0, 830.0, 4, 'pronunciation_repetition'),
              ]
              items: list[dict[str, object]] = []
              for phrase, start, end, minimum, role in checks:
                  expected = normalize_for_comparison(phrase)
                  region_text = ' '.join(
                      item.text for item in segments
                      if item.end >= start and item.start <= end
                  )
                  observed = normalize_for_comparison(region_text)
                  occurrences = observed.count(expected)
                  items.append({
                      'phrase': phrase,
                      'start': start,
                      'end': end,
                      'role': role,
                      'minimum_occurrences': minimum,
                      'observed_occurrences': occurrences,
                      'passed': occurrences >= minimum,
                  })
              return {
                  'status': 'PASS' if all(item['passed'] for item in items) else 'FAIL',
                  'profile': 'lesson76_time_local_repetition_regression_v21',
                  'scope': 'KNOWN_PHRASE_TIME_AND_OCCURRENCE_REGRESSION_NOT_ACCURACY_PERCENTAGE',
                  'items': items,
                  'passed_count': sum(bool(item['passed']) for item in items),
                  'total_count': len(items),
              }
          '''
          extension = textwrap.dedent(extension)
          marker = '\ndef run_child_v20() -> int:\n'
          if marker not in source:
              raise RuntimeError('run_child_v20 marker not found')
          source = source.replace(marker, '\n' + extension + '\ndef run_child_v21() -> int:\n', 1)

          replace_once("            print('TRANSCRIPTION_VERSION=20')\n", "            print('TRANSCRIPTION_VERSION=21')\n")
          replace_once(
              "            print('CONVERGENCE_POLICY=V18_CORE_PLUS_V19_TARGETED_RECOVERY_NO_GLOBAL_RESCAN')\n",
              "            print('CONVERGENCE_POLICY=FAST_PRIMARY_PLUS_TIME_LOCAL_SECTION_CONSENSUS')\n",
          )
          replace_once(
              "            print('TRANSCRIPTION_MODE=CONVERGED_FAST_PRIMARY_PLUS_TARGETED_GAP_CONSENSUS')\n",
              "            print('TRANSCRIPTION_MODE=CONVERGED_FAST_PRIMARY_PLUS_TIME_LOCAL_SECTION_CONSENSUS')\n",
          )
          replace_once(
              "            print('TARGETED_RECOVERY=GRAMMAR_ESSENTIAL_PRACTICAL_GAPS_ONLY')\n            print('TARGETED_RECOVERY_CONSENSUS=TWO_BOUNDARY_FORCED_ENGLISH')\n",
              "            print('SECTION_RECOVERY=GRAMMAR_ESSENTIAL_PRACTICAL_ONLY')\n            print('SECTION_RECOVERY_WINDOW=30_SECONDS_HOP_10_SECONDS')\n            print('SECTION_RECOVERY_CONSENSUS=TIME_LOCAL_OVERLAPPING_WINDOWS')\n",
          )

          start_marker = "            timer.start('targeted_gap_planning')\n"
          end_marker = "\n            del primary_model\n"
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = '''            timer.start('section_coverage_planning')
            gap_plan = section_coverage_plan_v21(
                post_opening_segments,
                audio_seconds,
            )
            timer.finish()
            print(f'SECTION_COVERAGE_COUNT={len(gap_plan)}')

            timer.start('section_coverage_recovery')
            recovered_segments: list[SegmentRecord] = []
            gap_evidence: list[dict[str, object]] = []
            section_window_counts: dict[str, int] = {}
            for section in gap_plan:
                section_name = str(section['section'])
                audit_segments, window_count = transcribe_section_windows_v21(
                    primary_model,
                    audio,
                    section_name=section_name,
                    start=float(section['start']),
                    end=float(section['end']),
                )
                section_window_counts[section_name] = window_count
                recovered, evidence = recover_time_local_consensus_v21(
                    post_opening_segments,
                    audit_segments,
                    section_name,
                )
                recovered_segments.extend(recovered)
                gap_evidence.extend(evidence)
                print(
                    f'SECTION_COVERAGE_RESULT SECTION={section_name} '
                    f'WINDOWS={window_count} RECOVERED={len(recovered)}'
                )
            recovered_segments = deduplicate_segments(recovered_segments)
            timer.finish()
'''
          source = source[:start] + replacement + source[end:]

          source = source.replace("timer.seconds_for('targeted_gap_planning')", "timer.seconds_for('section_coverage_planning')")
          source = source.replace("timer.seconds_for('targeted_gap_recovery')", "timer.seconds_for('section_coverage_recovery')")
          source = source.replace("'targeted_gap_planning_seconds': planning_seconds", "'section_coverage_planning_seconds': planning_seconds")
          source = source.replace("'targeted_gap_recovery_seconds': recovery_seconds", "'section_coverage_recovery_seconds': recovery_seconds")
          source = source.replace("'targeted_gap_recovery': {", "'section_coverage_recovery': {")
          source = source.replace("'planned_count': len(gap_plan),\n                    'accepted_count': len(recovered_segments),", "'section_count': len(gap_plan),\n                    'accepted_count': len(recovered_segments),\n                    'window_counts': section_window_counts,")
          source = source.replace("print(f'TARGETED_GAP_PLANNING_SECONDS={planning_seconds:.3f}')", "print(f'SECTION_COVERAGE_PLANNING_SECONDS={planning_seconds:.3f}')")
          source = source.replace("print(f'TARGETED_GAP_RECOVERY_SECONDS={recovery_seconds:.3f}')", "print(f'SECTION_COVERAGE_RECOVERY_SECONDS={recovery_seconds:.3f}')")
          source = source.replace("print(f'TARGETED_GAPS_PLANNED={len(gap_plan)}')", "print(f'SECTION_COVERAGE_SECTIONS={len(gap_plan)}')")
          source = source.replace("print(f'TARGETED_GAPS_ACCEPTED={len(recovered_segments)}')", "print(f'SECTION_RECOVERED_SEGMENTS={len(recovered_segments)}')")
          source = source.replace("regression_profile_v20(\n", "regression_profile_v21(\n", 1)
          source = source.replace("'version': 20,", "'version': 21,", 1)
          source = source.replace("'status': 'CANDIDATE_FOR_FINAL_ACCEPTANCE',", "'status': 'FINAL_ACCEPTANCE_TEST',", 1)
          source = source.replace("'source_versions_combined': [14, 16, 18, 19],", "'source_versions_combined': [14, 16, 18, 19, 20],", 1)
          source = source.replace("'mode': 'fast_primary_conditional_opening_targeted_gap_consensus',", "'mode': 'fast_primary_time_local_section_consensus',", 1)
          replace_once('    return run_child_v20()\n', '    return run_child_v21()\n')

          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile TRANSCRIBE_B.py
      - name: Validate v21 source
        shell: bash
        run: |
          python -m pip install --quiet pyflakes
          pyflakes TRANSCRIBE_B.py
          python - <<'PY'
          import ast
          import runpy
          from pathlib import Path

          source = Path('TRANSCRIBE_B.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          names = {node.name for node in ast.walk(tree) if isinstance(node, ast.FunctionDef)}
          required = {
              'run_child_v21',
              'section_coverage_plan_v21',
              'transcribe_section_windows_v21',
              'recover_time_local_consensus_v21',
              'regression_profile_v21',
          }
          missing = required - names
          if missing:
              raise SystemExit(f'missing v21 functions: {sorted(missing)}')
          assert 'return run_child_v21()' in source
          assert 'FULL_AUDIO_SECOND_PASS=DISABLED' in source
          assert 'LARGE_V3_AUTOMATIC_PASS=DISABLED' in source
          assert "'version': 21" in source

          module = runpy.run_path('TRANSCRIBE_B.py', run_name='v21_validation')
          SegmentRecord = module['SegmentRecord']
          regression = module['regression_profile_v21']
          result = regression(Path('not-b.m4a'), 10.0, [])
          assert result['status'] == 'NOT_APPLICABLE'

          language = module['language_label_v20']
          assert language('日本語') == 'ja'
          assert language('English sentence') == 'en'
          assert language('日本語 English') == 'mixed'
          print('V21_STATIC_AND_PURE_VALIDATION=PASS')
          PY
      - name: Commit validated v21
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TRANSCRIBE_B.py
          git commit -m "Converge transcription with time-local section consensus"
          git push origin HEAD:${{ github.head_ref }}
