name: Validate TRANSCRIBE_B v10

on:
  pull_request:
    paths:
      - TRANSCRIBE_B.py
      - .github/workflows/validate_transcribe_v10.yml

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m py_compile TRANSCRIBE_B.py
