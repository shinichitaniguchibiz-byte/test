                      print('TRANSCRIPTION_RESULT=CANCELLED', file=sys.stderr)
                      overall_result = 'CANCELLED'
                      return 130
                  except Exception as exception:
                      timer.fail_current()
                      print('TRANSCRIPTION_RESULT=FAILED', file=sys.stderr)
