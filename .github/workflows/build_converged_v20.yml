          '''
          extension = textwrap.dedent(extension)
          main_marker = '\ndef main() -> int:\n'
          if main_marker not in source:
              raise RuntimeError('main marker not found')
          source = source.replace(main_marker, '\n' + extension + main_marker, 1)
          old_call = '    return run_child()\n'
          if old_call not in source:
              raise RuntimeError('run_child call not found')
          source = source.replace(old_call, '    return run_child_v20()\n', 1)
          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile TRANSCRIBE_B.py
      - name: Run static and pure-function checks
        shell: bash
        run: |
          python -m pip install --quiet pyflakes
          pyflakes TRANSCRIBE_B.py
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path('TRANSCRIBE_B.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          names = {node.name for node in ast.walk(tree) if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}
          required = {
              'run_child_v20',
              'targeted_gap_plan_v20',
              'recover_targeted_gap_v20',
              'regression_profile_v20',
          }
          missing = required - names
          if missing:
              raise SystemExit(f'missing functions: {sorted(missing)}')
          if 'return run_child_v20()' not in source:
              raise SystemExit('main does not call run_child_v20')
          if 'DEFAULT_MAX_REPAIR_WINDOWS = 0' not in source:
              raise SystemExit('large-v3 default was not disabled')
          print('V20_STATIC_VALIDATION=PASS')
          PY
      - name: Commit validated v20
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TRANSCRIBE_B.py
          git commit -m "Build converged transcription v20"
          git push origin HEAD:${{ github.head_ref }}
