name: Build converged transcription v24

on:
  pull_request:
    paths:
      - .github/workflows/build_v24.yml
      - TRANSCRIBE_B.py

permissions:
  contents: write

jobs:
  build-v24:
    if: github.head_ref == 'deliverables/20260802-converged-transcription-v24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize v24 source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('TRANSCRIBE_B.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('V24_PATCH_APPLIED = True\nV24_PATCH_APPLIED = True', 'V24_PATCH_APPLIED = True')
          path.write_text(source, encoding='utf-8')
          PY
      - name: Validate v24 source
        shell: bash
        run: |
          python -m py_compile TRANSCRIBE_B.py
          python -m pip install --quiet pyflakes
          pyflakes TRANSCRIBE_B.py
          grep -q 'TRANSCRIPTION_VERSION = 24' TRANSCRIBE_B.py
          grep -q 'V24_PATCH_APPLIED = True' TRANSCRIBE_B.py
          grep -q 'MIN_SINGLE_EXAMPLE_AVG_LOGPROB = -0.35' TRANSCRIBE_B.py
          grep -q 'high_confidence_single_example' TRANSCRIBE_B.py
          grep -q 'window_seconds = 45.0 if section_name == "Essential Expressions"' TRANSCRIBE_B.py
          grep -q 'hop_seconds = 15.0 if section_name == "Essential Expressions"' TRANSCRIBE_B.py
          grep -q 'lesson76_time_local_repetition_regression_v24' TRANSCRIBE_B.py
          echo V24_VALIDATION=PASS
      - name: Commit normalized v24
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TRANSCRIBE_B.py
          if git diff --cached --quiet; then
            echo 'No source normalization required.'
          else
            git commit -m 'Normalize converged transcription v24'
            git push origin HEAD:deliverables/20260802-converged-transcription-v24
          fi
