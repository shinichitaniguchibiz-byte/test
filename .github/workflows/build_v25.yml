name: Build final converged transcription v25

on:
  pull_request:
    paths:
      - .github/workflows/build_v25.yml
      - TRANSCRIBE_B.py

permissions:
  contents: write

jobs:
  build-v25:
    if: github.head_ref == 'deliverables/20260802-final-transcription-v25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch v25 source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('TRANSCRIBE_B.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('TRANSCRIPTION_VERSION = 24', 'TRANSCRIPTION_VERSION = 25', 1)
          source = source.replace('radio-transcription-v24', 'radio-transcription-v25')
          source = source.replace('V24_PATCH_APPLIED = True\nV24_PATCH_APPLIED = True', 'V24_PATCH_APPLIED = True')
          source = source.replace('V24_PATCH_APPLIED = True', 'V24_PATCH_APPLIED = True\nV25_PATCH_APPLIED = True', 1)
          source = source.replace('source=f"v24_{slug}_w{window_count:02d}"', 'source=f"v25_{slug}_w{window_count:02d}"')
          source = source.replace('source="turbo_v24_time_local_section_consensus"', 'source="turbo_v25_time_local_section_consensus"')

          helper = '''def is_complete_english_candidate(text: str) -> bool:\n    words = english_words(text)\n    if len(words) < 5:\n        return False\n    if words[-1].lower() in {"and", "but", "for", "of", "to", "us", "we", "a", "the"}:\n        return False\n    if text.strip().lower().startswith("to "):\n        return False\n    return True\n\n\n'''
          if 'def is_complete_english_candidate' not in source:
              source = source.replace('def recover_time_local_consensus(', helper + 'def recover_time_local_consensus(', 1)
          source = source.replace(
              '            accepted = source_supported and event_avg_logprob >= MIN_EVENT_AVG_LOGPROB',
              '            complete_candidate = is_complete_english_candidate(canonical)\n            accepted = complete_candidate and source_supported and event_avg_logprob >= MIN_EVENT_AVG_LOGPROB',
              1,
          )
          source = source.replace(
              '                section_name == "Essential Expressions"\n                and len(sources) == 1',
              '                section_name == "Essential Expressions"\n                and complete_candidate\n                and len(sources) == 1',
              1,
          )
          source = source.replace(
              '            if already_present:\n                accepted = False',
              '            if not complete_candidate:\n                accepted = False\n                reason = "incomplete_candidate"\n            elif already_present:\n                accepted = False',
              1,
          )

          start = source.index('def correct_repeated_english_variants(')
          end = source.index('\ndef apply_corrections_to_segments', start)
          replacement = '''def correct_repeated_english_variants(\n    text: str,\n) -> tuple[str, list[dict[str, object]]]:\n    candidates = split_english_candidates(text)\n    clusters: list[list[str]] = []\n    for candidate in candidates:\n        normalized = normalize_for_comparison(candidate)\n        best_index: int | None = None\n        best_ratio = 0.0\n        for index, cluster in enumerate(clusters):\n            ratio = SequenceMatcher(None, normalized, normalize_for_comparison(cluster[0])).ratio()\n            if ratio > best_ratio:\n                best_index = index\n                best_ratio = ratio\n        if best_index is not None and best_ratio >= 0.82:\n            clusters[best_index].append(candidate)\n        else:\n            clusters.append([candidate])\n\n    corrected = text\n    corrections: list[dict[str, object]] = []\n    for cluster in clusters:\n        surface_counts = Counter(clean_text(candidate) for candidate in cluster)\n        normalized_counts = Counter(normalize_for_comparison(candidate) for candidate in cluster)\n        if sum(normalized_counts.values()) < 4 or len(normalized_counts) < 2:\n            continue\n        canonical_normalized, canonical_count = max(normalized_counts.items(), key=lambda item: (item[1], len(item[0])))\n        canonical_surfaces = [surface for surface in surface_counts if normalize_for_comparison(surface) == canonical_normalized]\n        canonical = max(canonical_surfaces, key=lambda value: (surface_counts[value], len(value)))\n        canonical_words = english_words(canonical)\n        if canonical_count < 2 or len(canonical_words) < 5:\n            continue\n        for variant_normalized, variant_count in normalized_counts.items():\n            if variant_normalized == canonical_normalized:\n                continue\n            variant_surfaces = [surface for surface in surface_counts if normalize_for_comparison(surface) == variant_normalized]\n            variant = max(variant_surfaces, key=lambda value: (surface_counts[value], len(value)))\n            variant_words = english_words(variant)\n            if not variant_words:\n                continue\n            if canonical_words[0].lower() != variant_words[0].lower() or canonical_words[-1].lower() != variant_words[-1].lower():\n                continue\n            if abs(len(canonical_words) - len(variant_words)) > 3:\n                continue\n            similarity = SequenceMatcher(None, canonical_normalized, variant_normalized).ratio()\n            if similarity < 0.82 or canonical_count <= variant_count:\n                continue\n            occurrences = 0\n            for surface in variant_surfaces:\n                count = corrected.count(surface)\n                if count:\n                    corrected = corrected.replace(surface, canonical)\n                    occurrences += count\n            if occurrences:\n                corrections.append({"from": variant, "to": canonical, "occurrences": occurrences, "canonical_count": canonical_count, "variant_count": variant_count, "similarity": round(similarity, 6)})\n    return corrected, corrections\n\n'''
          source = source[:start] + replacement + source[end+1:]
          source = source.replace('("Suppose we asked Emily for advice", 465.0, 535.0, 1, "essential_practice"),', '("Suppose we asked Emily for advice", 395.0, 425.0, 1, "essential_example"),')
          source = source.replace('("Imagine we asked Emily for advice", 465.0, 535.0, 1, "essential_practice"),', '("Imagine we asked Emily for advice", 395.0, 425.0, 1, "essential_example"),')
          source = source.replace('        ("Just an idea, but we could try leaving a little earlier tomorrow", 440.0, 490.0, 1, "essential_first_example"),\n', '')
          source = source.replace('lesson76_time_local_repetition_regression_v24', 'lesson76_time_local_repetition_regression_v25')
          source = source.replace('FAST_PRIMARY_PLUS_MIXED_LANGUAGE_COMPACT_CONSENSUS', 'FAST_PRIMARY_PLUS_FINAL_ADAPTIVE_CONSENSUS')
          source = source.replace('"source_versions_combined": [14, 16, 18, 19, 20, 22, 23],', '"source_versions_combined": [14, 16, 18, 19, 20, 22, 23, 24],')
          path.write_text(source, encoding='utf-8')
          PY
      - name: Validate v25 source
        shell: bash
        run: |
          python -m py_compile TRANSCRIBE_B.py
          python -m pip install --quiet pyflakes
          pyflakes TRANSCRIBE_B.py
          grep -q 'TRANSCRIPTION_VERSION = 25' TRANSCRIBE_B.py
          grep -q 'V25_PATCH_APPLIED = True' TRANSCRIBE_B.py
          grep -q 'def is_complete_english_candidate' TRANSCRIBE_B.py
          grep -q 'incomplete_candidate' TRANSCRIBE_B.py
          grep -q 'lesson76_time_local_repetition_regression_v25' TRANSCRIBE_B.py
          grep -q 'canonical_normalized, canonical_count' TRANSCRIBE_B.py
          echo V25_VALIDATION=PASS
      - name: Commit validated v25
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TRANSCRIBE_B.py
          git commit -m 'Build final converged transcription v25'
          git push origin HEAD:deliverables/20260802-final-transcription-v25
