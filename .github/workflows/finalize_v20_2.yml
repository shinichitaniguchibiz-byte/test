name: Finalize converged transcription v20 second pass

on:
  pull_request:
    paths:
      - .github/workflows/finalize_v20_2.yml

permissions:
  contents: write

jobs:
  finalize-v20-second-pass:
    if: github.head_ref == 'deliverables/20260802-converged-transcription-v20'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate the final v20 source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/build_converged_v20.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n          python -m py_compile TRANSCRIBE_B.py"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          patch = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/build_v20.py').write_text(patch, encoding='utf-8')
          PY
          python /tmp/build_v20.py
          python - <<'PY'
          from pathlib import Path
          path = Path('TRANSCRIBE_B.py')
          source = path.read_text(encoding='utf-8')
          needle = "            import faster_whisper\n            from faster_whisper import BatchedInferencePipeline, WhisperModel\n"
          index = source.rfind(needle)
          if index < 0:
              raise RuntimeError('v20 faster_whisper import block not found')
          replacement = "            import faster_whisper\n            _v20_faster_whisper_version = faster_whisper.__version__\n            print(f'FASTER_WHISPER={_v20_faster_whisper_version}')\n            from faster_whisper import BatchedInferencePipeline, WhisperModel\n"
          source = source[:index] + replacement + source[index + len(needle):]
          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile TRANSCRIBE_B.py
          python -m pip install --quiet pyflakes
          pyflakes TRANSCRIBE_B.py
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path('TRANSCRIBE_B.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          functions = {node.name for node in ast.walk(tree) if isinstance(node, ast.FunctionDef)}
          required = {'run_child_v20', 'targeted_gap_plan_v20', 'recover_targeted_gap_v20', 'regression_profile_v20'}
          missing = required - functions
          if missing:
              raise SystemExit(f'missing functions: {sorted(missing)}')
          checks = [
              'return run_child_v20()',
              'DEFAULT_MAX_REPAIR_WINDOWS = 0',
              'FULL_AUDIO_SECOND_PASS=DISABLED',
              'LARGE_V3_AUTOMATIC_PASS=DISABLED',
              'CANDIDATES_IN_TRANSCRIPT=NO',
              "'previous_run_timings': V20_PREVIOUS_RUNS",
          ]
          for check in checks:
              if check not in source:
                  raise SystemExit(f'missing source contract: {check}')
          print('V20_FINAL_STATIC_VALIDATION=PASS')
          PY
      - name: Commit final v20 source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TRANSCRIBE_B.py
          git commit -m "Finalize converged transcription v20"
          git push origin HEAD:${{ github.head_ref }}
