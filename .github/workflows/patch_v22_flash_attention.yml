name: Patch transcription v22 flash attention compatibility

on:
  pull_request:
    paths:
      - .github/workflows/patch_v22_flash_attention.yml

permissions:
  contents: write

jobs:
  patch-v22:
    if: github.head_ref == 'deliverables/20260802-converged-transcription-v22'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deliverables/20260802-converged-transcription-v22
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('TRANSCRIBE_B.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('TRANSCRIPTION_VERSION = 21', 'TRANSCRIPTION_VERSION = 22', 1)
          source = source.replace('use_flash_attention=False,', 'flash_attention=False,', 1)
          if 'V22_PATCH_APPLIED = True' not in source:
              marker = 'MIN_REPEATED_EVENT_AVG_LOGPROB = -0.48\n'
              if marker not in source:
                  raise RuntimeError('v22 marker insertion point not found')
              source = source.replace(marker, marker + 'V22_PATCH_APPLIED = True\n', 1)
          if 'use_flash_attention=' in source:
              raise RuntimeError('obsolete use_flash_attention argument remains')
          if 'flash_attention=False,' not in source:
              raise RuntimeError('flash_attention=False was not applied')
          path.write_text(source, encoding='utf-8')
          PY
      - name: Validate source and runtime API
        shell: bash
        run: |
          python -m py_compile TRANSCRIBE_B.py
          python -m pip install --quiet pyflakes 'ctranslate2==4.8.1' 'faster-whisper==1.2.1'
          pyflakes TRANSCRIBE_B.py
          python - <<'PY'
          from pathlib import Path
          import ctranslate2

          source = Path('TRANSCRIBE_B.py').read_text(encoding='utf-8')
          required = [
              'TRANSCRIPTION_VERSION = 22',
              'V22_PATCH_APPLIED = True',
              'flash_attention=False,',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'missing v22 markers: {missing}')
          if 'use_flash_attention=' in source:
              raise SystemExit('obsolete argument still present')

          try:
              ctranslate2.models.Whisper(
                  '/tmp/intentionally_missing_model',
                  device='cpu',
                  compute_type='default',
                  flash_attention=False,
              )
          except TypeError as exc:
              raise SystemExit(f'flash_attention constructor rejected: {exc}') from exc
          except Exception as exc:
              print(f'EXPECTED_MODEL_PATH_FAILURE={type(exc).__name__}: {exc}')

          print('V22_STATIC_VALIDATION=PASS')
          print(f'CTRANSLATE2_VERSION={ctranslate2.__version__}')
          PY
      - name: Commit validated v22
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TRANSCRIBE_B.py
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'Fix v22 flash attention constructor compatibility'
            git fetch origin deliverables/20260802-converged-transcription-v22
            git rebase origin/deliverables/20260802-converged-transcription-v22
            git push origin HEAD:deliverables/20260802-converged-transcription-v22
          fi
