name: Package TRANSCRIBE_B

on:
  push:
    paths:
      - ".github/workflows/package-transcribe-b.yml"
      - "radio/TRANSCRIBE_B.py"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile radio/TRANSCRIBE_B.py

      - name: Create ZIP
        run: |
          mkdir -p package
          cp radio/TRANSCRIBE_B.py package/TRANSCRIBE_B.py
          cd package
          zip -9 ../20260801_TRANSCRIBE_B.zip TRANSCRIBE_B.py

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: 20260801_TRANSCRIBE_B
          path: 20260801_TRANSCRIBE_B.zip
          if-no-files-found: error
          retention-days: 1
