name: Run converged transcription v25

on:
  push:
    branches:
      - deliverables/20260802-converged-transcription-v25

permissions:
  contents: write

jobs:
  run-v25:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deliverables/20260802-converged-transcription-v25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute v25 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/build_v25.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          block = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(code, 'v25_patch', 'exec'), {'__name__': '__main__'})
          PY
      - name: Validate v25
        shell: bash
        run: |
          python -m py_compile TRANSCRIBE_B.py
          python -m pip install --quiet pyflakes
          pyflakes TRANSCRIBE_B.py
          python - <<'PY'
          import importlib.util
          import sys

          spec = importlib.util.spec_from_file_location('transcribe_v25', 'TRANSCRIBE_B.py')
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          assert module.TRANSCRIPTION_VERSION == 25
          assert module.V25_PATCH_APPLIED is True
          assert module.is_complete_recovered_candidate('Suppose we asked Emily for advice')
          assert module.is_complete_recovered_candidate('Imagine we asked Emily for advice')
          assert module.is_complete_recovered_candidate('Just an idea, but we could try leaving a little earlier tomorrow.')
          assert not module.is_complete_recovered_candidate('Just an idea, but')
          assert not module.is_complete_recovered_candidate('It might be a good idea for us')
          assert not module.is_complete_recovered_candidate('to discuss this together.')
          sample = '\n'.join([
              'What if we baked him a cake ourselves?',
              'What if we baked him a cake ourselves?',
              'What if we baked him a cake ourselves?',
              'What if we baked him a cake ourselves?',
              'What if we baked a macaque ourselves?',
              'What if we baked a macaque ourselves?',
          ])
          corrected, corrections = module.correct_repeated_english_variants(sample)
          assert 'macaque' not in corrected
          assert corrections
          print('V25_VALIDATION=PASS')
          PY
      - name: Commit v25
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TRANSCRIBE_B.py
          git commit -m 'Build converged transcription v25'
          git push origin HEAD:deliverables/20260802-converged-transcription-v25
